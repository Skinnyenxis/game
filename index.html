<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Мобильное управление</title>
<style>
  body {
    margin: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: sans-serif;
    background: #f0f0f0;
  }
  #gameArea {
    width: 300px;
    height: 300px;
    background: #fff;
    border: 2px solid #ccc;
    position: relative;
    display: flex;
    justify-content: center;
    align-items: center;
  }
  #player {
    width: 40px;
    height: 40px;
    background: red;
    position: absolute;
    top: 130px;
    left: 130px;
    border-radius: 5px;
  }
  #controls {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    display: grid;
    grid-template-columns: 60px 60px 60px;
    grid-template-rows: 60px 60px;
    gap: 10px;
  }
  .btn {
    width: 60px;
    height: 60px;
    background: #333;
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 24px;
    border-radius: 10px;
    user-select: none;
    touch-action: manipulation;
  }
  .btn:active {
    background: #555;
  }
  #up { grid-column: 2; grid-row: 1; }
  #left { grid-column: 1; grid-row: 2; }
  #down { grid-column: 2; grid-row: 2; }
  #right { grid-column: 3; grid-row: 2; }
</style>
</head>
<body>

<div id="gameArea">
  <div id="player"></div>
</div>

<div id="controls">
  <div class="btn" id="up">↑</div>
  <div class="btn" id="left">←</div>
  <div class="btn" id="down">↓</div>
  <div class="btn" id="right">→</div>
</div>

<script>
const player = document.getElementById('player');
const moveAmount = 10; // Пикселей за один шаг

function movePlayer(dx, dy) {
  const rect = player.getBoundingClientRect();
  const parentRect = player.parentElement.getBoundingClientRect();
  let newLeft = rect.left - parentRect.left + dx;
  let newTop = rect.top - parentRect.top + dy;

  // Ограничение движения в пределах gameArea
  newLeft = Math.max(0, Math.min(newLeft, parentRect.width - rect.width));
  newTop = Math.max(0, Math.min(newTop, parentRect.height - rect.height));

  player.style.left = newLeft + 'px';
  player.style.top = newTop + 'px';
}

// Обработчики для кнопок
document.getElementById('up').addEventListener('touchstart', () => movePlayer(0, -moveAmount));
document.getElementById('down').addEventListener('touchstart', () => movePlayer(0, moveAmount));
document.getElementById('left').addEventListener('touchstart', () => movePlayer(-moveAmount, 0));
document.getElementById('right').addEventListener('touchstart', () => movePlayer(moveAmount, 0));

// Для ПК (клик мышью)
document.getElementById('up').addEventListener('mousedown', () => movePlayer(0, -moveAmount));
document.getElementById('down').addEventListener('mousedown', () => movePlayer(0, moveAmount));
document.getElementById('left').addEventListener('mousedown', () => movePlayer(-moveAmount, 0));
document.getElementById('right').addEventListener('mousedown', () => movePlayer(moveAmount, 0));
</script>

</body>
</html>
