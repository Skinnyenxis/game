<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Змейка с сенсорным управлением</title>
<style>
  body {
    margin: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    font-family: sans-serif;
    background: #f0f0f0;
  }
  #gameArea {
    position: relative;
    width: 300px;
    height: 300px;
    background: #fff;
    border: 2px solid #ccc;
    margin-top: 20px;
    display: grid;
    grid-template-columns: repeat(15, 20px);
    grid-template-rows: repeat(15, 20px);
  }
  .cell {
    width: 20px;
    height: 20px;
    box-sizing: border-box;
  }
  .snake { background: green; }
  .food { background: red; }

  #controls {
    margin-top: 20px;
    display: grid;
    grid-template-columns: 60px 60px 60px;
    grid-template-rows: 60px 60px;
    gap: 10px;
  }
  .btn {
    width: 60px;
    height: 60px;
    background: #333;
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 24px;
    border-radius: 10px;
    user-select: none;
    touch-action: manipulation;
  }
  .btn:active { background: #555; }
  #up { grid-column: 2; grid-row: 1; }
  #left { grid-column: 1; grid-row: 2; }
  #down { grid-column: 2; grid-row: 2; }
  #right { grid-column: 3; grid-row: 2; }
</style>
</head>
<body>

<h2>Змейка с сенсорным управлением</h2>
<div id="gameArea"></div>

<div id="controls">
  <div class="btn" id="up">↑</div>
  <div class="btn" id="left">←</div>
  <div class="btn" id="down">↓</div>
  <div class="btn" id="right">→</div>
</div>

<script>
const cols = 15;
const rows = 15;
const gameArea = document.getElementById('gameArea');
let snake = [{x:7, y:7}];
let dir = {x:0, y:0};
let food = {x: Math.floor(Math.random()*cols), y: Math.floor(Math.random()*rows)};
let gameInterval;

// Создание сетки
const cells = [];
for (let y=0; y<rows; y++) {
  cells[y] = [];
  for (let x=0; x<cols; x++) {
    const div = document.createElement('div');
    div.classList.add('cell');
    gameArea.appendChild(div);
    cells[y][x] = div;
  }
}

function draw() {
  // Очистка
  for (let row of cells) for (let cell of row) cell.className = 'cell';
  // Еда
  cells[food.y][food.x].classList.add('food');
  // Змейка
  for (let segment of snake) cells[segment.y][segment.x].classList.add('snake');
}

function moveSnake() {
  const head = {x: snake[0].x + dir.x, y: snake[0].y + dir.y};
  // Проверка границ и самопересечения
  if (head.x < 0 || head.x >= cols || head.y < 0 || head.y >= rows || snake.some(s => s.x===head.x && s.y===head.y)) {
    clearInterval(gameInterval);
    alert("Игра окончена!");
    return;
  }
  snake.unshift(head);

  // Проверка еды
  if (head.x === food.x && head.y === food.y) {
    food = {x: Math.floor(Math.random()*cols), y: Math.floor(Math.random()*rows)};
  } else {
    snake.pop();
  }

  draw();
}

// Управление кнопками
function setDir(x, y) {
  // Запрещаем движение в противоположную сторону
  if (snake.length > 1 && snake[0].x + x === snake[1].x && snake[0].y + y === snake[1].y) return;
  dir = {x, y};
}

['up','down','left','right'].forEach(id => {
  const btn = document.getElementById(id);
  const mapping = {up:[0,-1], down:[0,1], left:[-1,0], right:[1,0]}[id];
  btn.addEventListener('touchstart', () => setDir(mapping[0], mapping[1]));
  btn.addEventListener('mousedown', () => setDir(mapping[0], mapping[1]));
});

// Управление клавиатурой
document.addEventListener('keydown', e => {
  if (e.key === "ArrowUp") setDir(0,-1);
  if (e.key === "ArrowDown") setDir(0,1);
  if (e.key === "ArrowLeft") setDir(-1,0);
  if (e.key === "ArrowRight") setDir(1,0);
});

gameInterval = setInterval(moveSnake, 200);
draw();
</script>

</body>
</html>
