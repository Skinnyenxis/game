<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Мобильные Танчики</title>
<style>
  body { margin:0; overflow:hidden; background:#111; color:#fff; font-family:sans-serif; }
  canvas { display:block; background:#222; }
  #touchControls { display:none; }
  #joystick {
    position: fixed; bottom: 80px; left: 40px;
    width: 100px; height: 100px; border-radius: 50%;
    background: rgba(255,255,255,0.1);
    touch-action: none;
  }
  #fireBtn {
    position: fixed; bottom: 80px; right: 40px;
    width: 80px; height: 80px; border-radius: 50%;
    background: rgba(255,191,36,0.6); border:none;
    touch-action: none;
  }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="touchControls">
  <div id="joystick"></div>
  <button id="fireBtn"></button>
</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let keys = {};
let mouse = { down: false, x:0, y:0 };

let isMobile = /Mobi|Android/i.test(navigator.userAgent);
if(isMobile) {
  document.getElementById('touchControls').style.display = 'block';
}

// --- Игрок ---
let player = { x: canvas.width/2, y: canvas.height/2, size: 30, speed: 200 };

// --- Джойстик ---
let joystick = { x:0, y:0, active:false, startX:0, startY:0 };
const joyEl = document.getElementById('joystick');

joyEl.addEventListener('touchstart', e => {
  const t = e.touches[0];
  joystick.active = true;
  joystick.startX = t.clientX;
  joystick.startY = t.clientY;
});
joyEl.addEventListener('touchmove', e => {
  if(!joystick.active) return;
  const t = e.touches[0];
  joystick.x = Math.max(-50, Math.min(50, t.clientX - joystick.startX));
  joystick.y = Math.max(-50, Math.min(50, t.clientY - joystick.startY));
});
joyEl.addEventListener('touchend', e => {
  joystick.active = false;
  joystick.x = 0; joystick.y = 0;
});

// --- Кнопка огня ---
const fireBtn = document.getElementById('fireBtn');
fireBtn.addEventListener('touchstart', e => mouse.down = true);
fireBtn.addEventListener('touchend', e => mouse.down = false);

// --- Управление клавиатурой ---
document.addEventListener('keydown', e => keys[e.key] = true);
document.addEventListener('keyup', e => keys[e.key] = false);

// --- Вспомогательная функция ---
function clamp(x, min, max){ return Math.min(max, Math.max(min,x)); }

// --- Снаряды ---
let bullets = [];
function shoot(){
  bullets.push({ x: player.x, y: player.y, vx: 0, vy: -400, size:5 });
}

// --- Основной цикл ---
let lastTime = 0;
function loop(ts){
  const dt = (ts - lastTime)/1000;
  lastTime = ts;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}

// --- Обновление ---
function update(dt){
  let ax=0, ay=0;

  // ПК клавиши
  if(keys['ArrowLeft'] || keys['a']) ax -= player.speed;
  if(keys['ArrowRight']|| keys['d']) ax += player.speed;
  if(keys['ArrowUp']   || keys['w']) ay -= player.speed;
  if(keys['ArrowDown'] || keys['s']) ay += player.speed;

  // Мобильный джойстик
  if(isMobile && joystick.active){
    ax = joystick.x * 4;  // масштабируем
    ay = joystick.y * 4;
  }

  player.x += ax*dt;
  player.y += ay*dt;

  // Ограничения экрана
  player.x = clamp(player.x, player.size/2, canvas.width-player.size/2);
  player.y = clamp(player.y, player.size/2, canvas.height-player.size/2);

  // Стрельба
  if(mouse.down) shoot();
  bullets.forEach(b => { b.y += b.vy*dt; });
  bullets = bullets.filter(b => b.y + b.size >0);
}

// --- Отрисовка ---
function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);

  // Игрок
  ctx.fillStyle = 'lime';
  ctx.beginPath();
  ctx.arc(player.x, player.y, player.size/2,0,2*Math.PI);
  ctx.fill();

  // Снаряды
  ctx.fillStyle = 'yellow';
  bullets.forEach(b => {
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.size,0,2*Math.PI);
    ctx.fill();
  });
}

requestAnimationFrame(loop);

// --- Обновление размера экрана ---
window.addEventListener('resize', ()=>{ canvas.width=window.innerWidth; canvas.height=window.innerHeight; });

</script>
</body>
</html>
